<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScaleCraft AI CRM — Enterprise Live Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #060d1f;
      --navy-2: #0c1733;
      --navy-3: #132247;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-soft: #eff6ff;
      --teal: #14b8a6;
      --teal-soft: #f0fdfa;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --radius: 14px;
      --shadow: 0 8px 24px -10px rgba(15, 23, 42, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, var(--navy) 0%, #09132b 100%);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.08);
      height: 100vh;
      position: sticky;
      top: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 11px;
      color: #fff; font-weight: 800; font-size: 16px;
      padding: 4px 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 14px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      display: grid; place-items: center; font-size: 13px; color: #fff; font-weight: 800;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }
    .brand small { display: block; font-size: 11px; color: #5eead4; font-weight: 600; }

    .nav-section-label {
      font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      color: #64748b; padding: 8px 10px 4px;
    }
    .nav-group { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
    .nav-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; text-align: left;
      padding: 9px 11px; border-radius: 10px;
      color: #cbd5e1; font-size: 13px; font-weight: 600;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(37,99,235,0.95), rgba(37,99,235,0.75));
      color: #fff;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
    }
    .nav-left { display: flex; align-items: center; gap: 9px; }
    .nav-ico { width: 16px; height: 16px; opacity: 0.9; flex-shrink: 0; }
    .nav-badge {
      font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background: rgba(255,255,255,0.14); color: #fff;
    }
    .nav-btn.active .nav-badge { background: rgba(255,255,255,0.22); }

    .side-foot {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
      display: flex; flex-direction: column; gap: 7px;
      font-size: 12px;
    }
    .side-link {
      display: block; padding: 8px 11px; border-radius: 9px;
      background: rgba(255,255,255,0.06); color: #e2e8f0; text-align: center; font-weight: 600;
      transition: background 0.15s ease;
    }
    .side-link:hover { background: rgba(255,255,255,0.12); }

    /* Main Shell */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 11px 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 30;
    }
    .top-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mob-toggle { display: none; font-size: 18px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; }
    .page-title { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .demo-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: var(--teal-soft); color: #0f766e; border: 1px solid rgba(20,184,166,0.35);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }

    .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-box {
      position: relative; display: flex; align-items: center;
    }
    .search-box input {
      padding: 7px 11px 7px 30px; border-radius: 9px; border: 1px solid var(--border);
      background: #f8fafc; font-size: 12.5px; width: 195px;
    }
    .search-box svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--muted); }
    .ind-select {
      padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border);
      background: #f8fafc; font-size: 12.5px; font-weight: 700; color: var(--text);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 700;
      transition: all 0.15s ease;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-teal { background: var(--teal); color: #042f2e; }
    .btn-teal:hover { filter: brightness(1.06); }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: #94a3b8; background: #f8fafc; }
    .btn-danger { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }

    /* Mobile Preview Mode Frame */
    .workspace-wrap { padding: 20px 22px; flex: 1; transition: all 0.25s ease; }
    .workspace-wrap.mobile-frame {
      max-width: 430px;
      margin: 18px auto;
      border: 10px solid #0f172a;
      border-radius: 32px;
      background: var(--bg);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
      min-height: 760px;
    }
    .workspace-wrap.mobile-frame .kpi-grid,
    .workspace-wrap.mobile-frame .kanban,
    .workspace-wrap.mobile-frame .two-col,
    .workspace-wrap.mobile-frame .inbox-wrap,
    .workspace-wrap.mobile-frame .analytics-grid {
      grid-template-columns: 1fr !important;
    }

    .content { display: flex; flex-direction: column; gap: 16px; }

    /* KPI & Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .kpi {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 15px 17px; box-shadow: var(--shadow);
    }
    .kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .kpi small { font-size: 12px; font-weight: 700; color: var(--muted); }
    .kpi b { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; display: block; }
    .kpi .sub { font-size: 11.5px; color: var(--green); font-weight: 700; margin-top: 3px; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .card-head h3 { font-size: 15.5px; font-weight: 800; }

    .two-col { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 16px; }
    .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* AI Brief Banner */
    .ai-banner {
      background: linear-gradient(135deg, var(--navy) 0%, #142754 100%);
      color: #fff; border-radius: var(--radius); padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
      box-shadow: 0 14px 32px -12px rgba(7, 16, 36, 0.45);
    }
    .ai-tag {
      display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: #5eead4; margin-bottom: 4px;
    }

    /* Bar Chart */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; }
    .bar-label { width: 96px; font-weight: 700; color: #334155; flex-shrink: 0; }
    .bar-track { flex: 1; height: 11px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--teal)); }
    .bar-val { width: 78px; text-align: right; font-weight: 800; color: var(--text); }

    /* Kanban */
    .view-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .seg-toggle { display: inline-flex; background: #e2e8f0; padding: 3px; border-radius: 9px; gap: 3px; }
    .seg-btn { padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .seg-btn.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
    .kb-col {
      background: #e2e8f0; border-radius: var(--radius); padding: 11px;
      min-height: 390px; display: flex; flex-direction: column; gap: 9px;
    }
    .kb-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 800; padding: 2px 4px; }
    .kb-sum { font-size: 11px; color: #475569; font-weight: 700; }
    .kb-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      display: flex; flex-direction: column; gap: 7px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.05);
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .kb-card:hover { transform: translateY(-2px); border-color: #93c5fd; }
    .kb-title-row { display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 8px;
      background: #eff6ff; color: var(--blue); font-size: 11px; font-weight: 800;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .kb-card h4 { font-size: 13.5px; font-weight: 800; cursor: pointer; }
    .kb-card h4:hover { color: var(--blue); }
    .kb-meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
    .kb-actions { display: flex; gap: 5px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid #f1f5f9; }
    .mini-btn {
      font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
      background: #f1f5f9; color: #334155;
    }
    .mini-btn:hover { background: #e2e8f0; }

    /* Inbox */
    .inbox-wrap { display: grid; grid-template-columns: 310px 1fr; gap: 14px; min-height: 490px; }
    .thread-list { display: flex; flex-direction: column; gap: 8px; }
    .thread-item {
      text-align: left; padding: 12px; border-radius: 11px; border: 1px solid var(--border); background: #fff;
      display: flex; flex-direction: column; gap: 5px; transition: all 0.12s ease;
    }
    .thread-item.active { border-color: var(--blue); background: var(--blue-soft); }
    .chat-box { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .ai-summary {
      background: var(--teal-soft); border: 1px solid rgba(20,184,166,0.32);
      border-radius: 10px; padding: 11px 13px; font-size: 12.5px;
    }
    .msgs { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
    .msg { padding: 9px 12px; border-radius: 10px; font-size: 13px; max-width: 82%; }
    .msg.in { background: #f1f5f9; align-self: flex-start; }
    .msg.out { background: var(--navy); color: #fff; align-self: flex-end; }
    .chat-compose { display: flex; gap: 8px; }
    .chat-compose input {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px;
    }

    /* AI Operator */
    .op-bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .op-bar input { flex: 1; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; }
    .prompt-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .chip-btn {
      font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px;
      background: #eff6ff; color: var(--blue); border: 1px solid #bfdbfe;
    }
    .chip-btn:hover { background: #dbeafe; }
    .ai-chat-log {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; max-height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .queue-item {
      border: 1px solid #fde68a; border-radius: 12px; padding: 13px; margin-bottom: 9px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #fffbeb;
    }
    .log-item {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px;
    }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--border); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 800; }

    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .b-green { background: #dcfce7; color: #166534; }
    .b-amber { background: #fef3c7; color: #92400e; }
    .b-red { background: #fee2e2; color: #991b1b; }
    .b-blue { background: #dbeafe; color: #1e40af; }
    .b-slate { background: #f1f5f9; color: #334155; }

    /* Automation Switch */
    .auto-row {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 9px;
    }
    .switch {
      width: 44px; height: 24px; border-radius: 999px; background: #cbd5e1; position: relative; transition: 0.2s; flex-shrink: 0;
    }
    .switch::after {
      content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px; transition: 0.2s;
    }
    .switch.on { background: var(--teal); }
    .switch.on::after { left: 23px; }

    /* Lead 360 Slide-Over Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(2,6,23,0.52); display: none; justify-content: flex-end; z-index: 95;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer {
      width: 100%; max-width: 460px; background: #fff; height: 100%; overflow-y: auto;
      padding: 22px; box-shadow: -16px 0 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 14px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(2,6,23,0.68); display: none; place-items: center; padding: 18px; z-index: 100;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      background: #fff; border-radius: 16px; max-width: 560px; width: 100%; padding: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto;
    }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 13px;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 18px; right: 18px; z-index: 120;
      background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      display: none;
    }
    .toast.show { display: block; }

    @media (max-width: 1020px) {
      .sidebar {
        position: fixed; left: -275px; top: 0; bottom: 0; z-index: 80; transition: left 0.2s ease;
      }
      .sidebar.open { left: 0; }
      .mob-toggle { display: inline-block; }
      .kpi-grid, .kanban { grid-template-columns: 1fr 1fr; }
      .two-col, .inbox-wrap, .analytics-grid { grid-template-columns: 1fr; }
      .search-box { display: none; }
    }
    @media (max-width: 600px) {
      .kpi-grid, .kanban { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">SC</div>
      <div>ScaleCraft CRM<small>AI Operator Inside</small></div>
    </div>

    <div class="nav-group" id="navGroup">
      <div class="nav-section-label">Workspace</div>
      <button class="nav-btn active" data-tab="dashboard">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Owner Dashboard
        </span>
      </button>
      <button class="nav-btn" data-tab="pipeline">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
          Leads &amp; Pipeline
        </span>
        <span class="nav-badge" id="leadCountBadge">0</span>
      </button>
      <button class="nav-btn" data-tab="inbox">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Unified Inbox
        </span>
        <span class="nav-badge" id="inboxBadge">0</span>
      </button>
      <button class="nav-btn" data-tab="tasks">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks &amp; Field Ops
        </span>
        <span class="nav-badge" id="taskBadge">0</span>
      </button>

      <div class="nav-section-label">AI &amp; Revenue</div>
      <button class="nav-btn" data-tab="ai">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15 8l6 3-6 3-3 6-3-6-6-3 6-3z"/></svg>
          AI Operator
        </span>
        <span class="nav-badge" id="queueBadge">0</span>
      </button>
      <button class="nav-btn" data-tab="billing">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
          GST Quotes &amp; Bills
        </span>
      </button>
      <button class="nav-btn" data-tab="analytics">
        <span class="nav-left">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          Analytics &amp; Team
        </span>
      </button>

        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
        const cfg = getCloudCfg();
        const auth = getAuth();
        if (cfg.url && cfg.anonKey && auth && auth.access_token && auth.user?.id) {
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => pushWorkspaceToCloud(), 600);
        }
      }

      async function pushWorkspaceToCloud() {
        const cfg = getCloudCfg();
        const auth = getAuth();
        if (!cfg.url || !cfg.anonKey || !auth?.access_token || !auth?.user?.id) return;
        try {
          await fetch(`${cfg.url}/rest/v1/crm_workspaces`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": cfg.anonKey,
              "Authorization": `Bearer ${auth.access_token}`,
              "Prefer": "resolution=merge-duplicates"
            },
            body: JSON.stringify({
              user_id: auth.user.id,
              preset: state.preset,
              data: state,
              updated_at: new Date().toISOString()
            })
          });
        } catch (_) {}
      }

      async function pullWorkspaceFromCloud() {
        const cfg = getCloudCfg();
        const auth = getAuth();
        if (!cfg.url || !cfg.anonKey || !auth?.access_token || !auth?.user?.id) return false;
        try {
          const res = await fetch(`${cfg.url}/rest/v1/crm_workspaces?user_id=eq.${auth.user.id}&select=data`, {
            headers: { "apikey": cfg.anonKey, "Authorization": `Bearer ${auth.access_token}` }
          });
          if (!res.ok) return false;
          const rows = await res.json();
          if (rows && rows[0] && rows[0].data && rows[0].data.leads) {
            state = rows[0].data;
            indSelect.value = state.preset || "distribution";
            save();
            render();
            return true;
          }
        } catch (_) {}
        return false;
      }

      // Cloud Backend Setup + Supabase Auth + Pull Website Inquiries
      document.getElementById("cloudAuthBtn").addEventListener("click", () => {

        openModal("ScaleCraft Cloud Backend (Supabase)", `
          <form id="cloudCfgForm" style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);">
            <div class="field"><label>Supabase Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co" value="${cfg.url || ""}" required /></div>

          </form>

            <div style="background:#dcfce7;color:#166534;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px;">

            <form id="cloudLoginForm">
              <div class="field"><label>Workspace Email</label><input id="authEmail" type="email" required placeholder="contact.scalecraft@gmail.com" /></div>
              <div class="field"><label>Password (min 6 chars)</label><input id="authPass" type="password" required minlength="6" /></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <button class="btn btn-primary" type="submit" data-auth-mode="login">Sign In</button>

              </div>
            </form>
          `}
        `);

        document.getElementById("cloudCfgForm").addEventListener("submit", (ev) => {
          ev.preventDefault();
          const url = document.getElementById("cfgUrl").value.trim().replace(/\/$/, "");
          const anonKey = document.getElementById("cfgKey").value.trim();
          localStorage.setItem(CFG_KEY, JSON.stringify({ url, anonKey }));
          updateShell();
          showToast("Supabase URL & Key saved!");
        });

        async function doAuth(mode) {
          const sb = getSbClient(false);
          if (!sb) { showToast("Save Supabase URL & Anon Key first"); return; }
          const email = document.getElementById("authEmail").value.trim();
          const password = document.getElementById("authPass").value;
          try {
            const resp = mode === "signup"
              ? await sb.auth.signUp({ email, password })
              : await sb.auth.signInWithPassword({ email, password });
            if (resp.error) throw new Error(resp.error.message || "Auth failed");
            if (resp.data?.session?.access_token) {
              localStorage.setItem(AUTH_KEY, JSON.stringify(resp.data.session));
              const loaded = await pullWorkspaceFromCloud();
              if (!loaded) await pushWorkspaceToCloud();
              closeModal();
              render();
              showToast("Cloud Workspace connected!");
            } else {
              showToast("Account created! Check email or Sign In.");
            }
          } catch (err) {
            showToast(err.message);
          }
        }

        const loginForm = document.getElementById("cloudLoginForm");
        if (loginForm) {
          loginForm.addEventListener("submit", (ev) => { ev.preventDefault(); doAuth("login"); });
          document.getElementById("cloudSignupBtn").addEventListener("click", () => doAuth("signup"));
        }

        const pullBtn = document.getElementById("pullWebLeadsBtn");
        if (pullBtn) {
          pullBtn.addEventListener("click", async () => {
            const sb = getSbClient(true);
            if (!sb) { showToast("Backend SDK not ready"); return; }
            try {
              const { data: rows, error } = await sb
                .from("project_inquiries")
                .select("*")
                .order("created_at", { ascending: false })
                .limit(20);
              if (error) throw new Error(error.message);
              if (!Array.isArray(rows) || !rows.length) { showToast("No new website inquiries yet."); return; }
              let added = 0;
              rows.forEach(r => {
                if (!state.leads.some(l => l.id === "web_" + r.id)) {
                  state.leads.unshift({
                    id: "web_" + r.id,
                    name: `${r.business_name} (${r.ref_code})`,
                    contact: r.business_name,
                    phone: r.contact_phone || r.contact_email || "Website Brief",
                    owner: "Aarav",
                    source: "Website",
                    stage: "New Lead",
                    value: 34999,
                    note: `${r.system_type} · ${r.timeline}`,
                    timeline: [`Website brief submitted: ${(r.modules || []).join(", ")}`]
                  });
                  added++;
                }
              });
              save(); closeModal(); state.tab = "pipeline"; render();
              showToast(added ? `Imported ${added} website inquiry lead(s)!` : "All website leads already imported.");
            } catch (err) {
              showToast("Import failed: " + err.message);
            }
          });
        }

        const syncBtn = document.getElementById("forceSyncBtn");
        if (syncBtn) {
          syncBtn.addEventListener("click", async () => {
            await pushWorkspaceToCloud();
            showToast("Synced workspace to Postgres!");

        const outBtn = document.getElementById("signOutBtn");
        if (outBtn) {
          outBtn.addEventListener("click", () => {
            localStorage.removeItem(AUTH_KEY);
            closeModal(); render(); showToast("Signed out — back to Demo Mode");

      // Add Lead
      document.getElementById("newLeadBtn").addEventListener("click", () => {

      // Main Content Events
      mainEl.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]");
        if (go) { state.tab = go.dataset.go; save(); render(); return; }

        const pv = e.target.closest("[data-pview]");
        if (pv) { state.pipelineView = pv.dataset.pview; save(); render(); return; }

        const openLead = e.target.closest("[data-open-lead]");
        if (openLead) { state.selectedLeadId = openLead.dataset.openLead; renderDrawer(); return; }

        const move = e.target.closest("[data-move]");
        if (move) {
          const lead = state.leads.find(l => l.id === move.dataset.move);
          if (lead) {
            const idx = STAGES.indexOf(lead.stage) + Number(move.dataset.dir);
            if (idx >= 0 && idx < STAGES.length) {
              lead.stage = STAGES[idx];
              lead.timeline = lead.timeline || [];
              lead.timeline.unshift(`Moved to ${lead.stage}`);
              save(); render();
            }
          }
          return;
        }

        const th = e.target.closest("[data-thread]");
        if (th) { state.activeThreadId = th.dataset.thread; save(); render(); return; }

        if (e.target.id === "aiDraftReplyBtn") {
          const active = state.threads.find(t => t.id === state.activeThreadId);
          const input = document.getElementById("chatInput");
          if (active && input) {
            input.value = `Namaste ${active.client} ji, ${active.nextAction} Bataiye aaj kis time confirm karein?`;
            input.focus();
          }
          return;
        }

        if (e.target.id === "chatToTaskBtn") {
          const active = state.threads.find(t => t.id === state.activeThreadId);
          if (active) {
            state.tasks.unshift({ id: "tk" + Date.now(), title: `${active.client}: ${active.nextAction}`, owner: "Aarav", due: "Today", priority: "High", done: false });
            save(); render(); showToast("Task created from Unified Inbox!");
          }
          return;
        }

        const tTask = e.target.closest("[data-toggle-task]");
        if (tTask) {
          const tk = state.tasks.find(x => x.id === tTask.dataset.toggleTask);
          if (tk) { tk.done = !tk.done; save(); render(); }
          return;
        }

        if (e.target.id === "newTaskBtn") {
          openModal("Add Task", `
            <form id="tkForm">
              <div class="field"><label>Task Title</label><input id="tkTitle" required placeholder="e.g., Call client for GST number" /></div>
              <div class="field"><label>Owner &amp; Priority</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <select id="tkOwner"><option>Aarav</option><option>Neha</option><option>Rohan</option></select>
                  <select id="tkPrio"><option>High</option><option>Medium</option></select>
                </div>
              </div>
              <button class="btn btn-primary" type="submit" style="width:100%;">Save Task</button>
            </form>
          `);
          document.getElementById("tkForm").addEventListener("submit", (ev) => {
            ev.preventDefault();
            state.tasks.unshift({ id: "tk" + Date.now(), title: document.getElementById("tkTitle").value.trim(), owner: document.getElementById("tkOwner").value, due: "Today", priority: document.getElementById("tkPrio").value, done: false });
            save(); closeModal(); render(); showToast("Task added!");
          });
          return;
        }

        const chip = e.target.closest("[data-ai-cmd]");
        if (chip) { runAICommand(chip.dataset.aiCmd); return; }

        const app = e.target.closest("[data-approve]");
        if (app) {
          const q = state.aiQueue.find(x => x.id === app.dataset.approve);
          if (q) {
            state.aiQueue = state.aiQueue.filter(x => x.id !== q.id);
            state.aiLogs.unshift({ id: "log" + Date.now(), text: `Executed: ${q.title} — ${q.detail}`, time: "Just now", reversible: true, undoPayload: q });
            save(); render(); showToast("Action approved & logged!");
          }
          return;
        }

        const rej = e.target.closest("[data-reject]");
        if (rej) { state.aiQueue = state.aiQueue.filter(x => x.id !== rej.dataset.reject); save(); render(); return; }

        const undo = e.target.closest("[data-undo]");
        if (undo) {
          const log = state.aiLogs.find(l => l.id === undo.dataset.undo);
          if (log && log.undoPayload) {
            state.aiQueue.unshift(log.undoPayload);
            state.aiLogs = state.aiLogs.filter(l => l.id !== log.id);
            save(); render(); showToast("Action reverted back to Queue!");
          }
          return;
        }

        if (e.target.id === "exportLeadsBtn") {
          const rows = [["Account", "Contact", "Phone", "Owner", "Source", "Stage", "Value"]];
          state.leads.forEach(l => rows.push([l.name, l.contact, l.phone, l.owner, l.source, l.stage, l.value]));
          downloadCSV("scalecraft-leads.csv", rows);
          return;
        }
        if (e.target.id === "exportInvBtn") {
          const rows = [["Invoice", "Client", "Base", "GST_18", "Total", "Status"]];
          state.invoices.forEach(i => { const b = invBase(i); const g = Math.round(b * 0.18); rows.push([i.id, i.client, b, g, b + g, i.status]); });
          downloadCSV("scalecraft-gst-invoices.csv", rows);
          return;
        }
        if (e.target.id === "newInvBtn") { openInvoiceModal(""); return; }

        const paid = e.target.closest("[data-mark-paid]");
        if (paid) {
          const inv = state.invoices.find(i => i.id === paid.dataset.markPaid);
          if (inv) { inv.status = "Paid"; inv.days = 0; save(); render(); showToast(`${inv.id} marked Paid!`); }
          return;
        }

        const printBtn = e.target.closest("[data-print-inv]");
        if (printBtn) {
          const inv = state.invoices.find(i => i.id === printBtn.dataset.printInv);
          if (inv) {
            const base = invBase(inv);
            const cgst = Math.round(base * 0.09);
            const sgst = Math.round(base * 0.09);
            openModal(`Tax Invoice ${inv.id}`, `
              <div style="border:1px solid var(--border);border-radius:12px;padding:16px;font-size:13px;display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;justify-content:space-between;"><strong>ScaleCraft GST Billing</strong><strong>${inv.id}</strong></div>
                <div><strong>Billed To:</strong> ${inv.client}</div>
                <table style="margin:6px 0;">
                  <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amt</th></tr></thead>
                  <tbody>${inv.items.map(it => `<tr><td>${it.desc}</td><td>${it.qty}</td><td>${fmtINR(it.rate)}</td><td>${fmtINR(it.qty * it.rate)}</td></tr>`).join("")}</tbody>
                </table>
                <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>${fmtINR(base)}</span></div>
                <div style="display:flex;justify-content:space-between;"><span>CGST (9%) + SGST (9%)</span><span>${fmtINR(cgst + sgst)}</span></div>
                <div style="display:flex;justify-content:space-between;font-size:16px;"><strong>Grand Total</strong><strong>${fmtINR(base + cgst + sgst)}</strong></div>
              </div>
              <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="window.print()">Print / Save PDF</button>
            `);

        if (portalBtn) {
          openClientPortal(portalBtn.dataset.clientPortal);
          return;

        const tog = e.target.closest("[data-toggle-auto]");
        if (tog) {
          const a = state.automations.find(x => x.id === tog.dataset.toggleAuto);
          if (a) { a.on = !a.on; save(); render(); }
          return;
        }

        const testAuto = e.target.closest("[data-test-auto]");
        if (testAuto) {
          const a = state.automations.find(x => x.id === testAuto.dataset.testAuto);
          if (a) {
            a.runs += 1;
            state.aiLogs.unshift({ id: "log" + Date.now(), text: `Automation test fired: "${a.name}"`, time: "Just now", reversible: false });
            save(); render(); showToast(`Test run completed: ${a.name}`);
          }
        }
      });

                <button type="button" id="portalUpiPayBtn" class="btn btn-teal">Pay via UPI (${fmtINR(total)})</button>
              </div>
            ` : `<div style="font-size:12.5px;color:#166534;font-weight:700;">Payment verified! Receipt &amp; GST Tax PDF unlocked for ${inv.client}.</div>`}
          </div>
        `);
        const appBtn = document.getElementById("portalApproveBtn");
        if (appBtn) {
          appBtn.addEventListener("click", () => {
            const lead = state.leads.find(l => l.name.toLowerCase().includes(inv.client.toLowerCase().split(" ")[0]));
            if (lead) { lead.stage = "Quote Sent"; lead.timeline.unshift(`Client approved quote ${inv.id} via Customer Portal`); }
            state.aiLogs.unshift({ id: "log" + Date.now(), text: `Client Portal: ${inv.client} approved ${inv.id}.`, time: "Just now", reversible: false });
            save(); closeModal(); render(); showToast("Quote approved from Client Portal!");
          });
        }
        const payBtn = document.getElementById("portalUpiPayBtn");
        if (payBtn) {
          payBtn.addEventListener("click", () => {
            inv.status = "Paid"; inv.days = 0;
            const lead = state.leads.find(l => l.name.toLowerCase().includes(inv.client.toLowerCase().split(" ")[0]));
            if (lead) { lead.stage = "Won"; lead.timeline.unshift(`UPI payment ${fmtINR(total)} completed via Client Portal`); }
            state.aiLogs.unshift({ id: "log" + Date.now(), text: `Client Portal UPI Payment received: ${inv.id} (${fmtINR(total)}).`, time: "Just now", reversible: false });
            save(); closeModal(); render(); showToast(`UPI Payment received! ${inv.id} marked Paid & Deal Won.`);
          });
        }
      }

      document.getElementById("voiceNoteBtn").addEventListener("click", () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        openModal("Voice-to-CRM Extractor (Field Staff Mode)", `
          <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">Speak or paste a quick Hindi/English voice note. ScaleCraft AI automatically extracts the Lead, Deal Value, and Follow-up Task.</p>
          <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
            <button type="button" id="startMicBtn" class="btn btn-teal">${SpeechRec ? "Start Live Mic" : "Mic Unavailable (Use Sample)"}</button>
            <button type="button" id="sampleVoiceBtn" class="btn btn-outline">Load Sample Voice Note</button>
          </div>
          <form id="voiceParseForm">
            <div class="field"><label>Voice Transcript</label><textarea id="voiceText" rows="3" required placeholder="e.g., Ramesh from Balaji Traders called for 100 crates worth 45000 rupees, follow up tomorrow 11 AM"></textarea></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Extract Lead &amp; Create Follow-up Task</button>
          </form>
        `);
        document.getElementById("sampleVoiceBtn").addEventListener("click", () => {
          document.getElementById("voiceText").value = "Daksh from Apex Traders called on WhatsApp, wants custom AI CRM worth 55000 rupees, follow up tomorrow 11 AM";
        });
        document.getElementById("startMicBtn").addEventListener("click", () => {
          if (!SpeechRec) { document.getElementById("sampleVoiceBtn").click(); showToast("Loaded sample voice note"); return; }
          const rec = new SpeechRec();
          rec.lang = "en-IN";
          rec.onresult = (ev) => {
            document.getElementById("voiceText").value = ev.results?.[0]?.[0]?.transcript || "";
          };
          rec.start();
          showToast("Listening... speak your CRM update");
        });
        document.getElementById("voiceParseForm").addEventListener("submit", (ev) => {
          ev.preventDefault();
          const txt = document.getElementById("voiceText").value.trim();
          const amtMatch = txt.match(/(\d[\d,]{2,})/);
          const val = amtMatch ? Number(amtMatch[1].replace(/,/g, "")) : 35000;
          const nameMatch = txt.match(/(?:from|at|for)\s+([A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+)?)/);
          const biz = nameMatch ? nameMatch[1] : "Voice Note Lead";
          const contactMatch = txt.match(/^([A-Z][a-zA-Z]+)/);
          const contact = contactMatch ? contactMatch[1] : "Owner";
          state.leads.unshift({
            id: "l" + Date.now(),
            name: biz,
            contact,
            phone: "+91 98000 00000",
            owner: "Aarav",
            source: "WhatsApp",
            stage: "Qualified",
            value: val,
            note: txt,
            timeline: [`Voice-to-CRM extracted (${fmtINR(val)})`]
          });
          state.tasks.unshift({
            id: "tk" + Date.now(),
            title: `Follow up ${biz} (${fmtINR(val)})`,
            owner: "Aarav",
            due: txt.toLowerCase().includes("tomorrow") ? "Tomorrow" : "Today",
            priority: "High",
            done: false
          });
          state.aiLogs.unshift({ id: "log" + Date.now(), text: `Voice-to-CRM created lead "${biz}" + follow-up task.`, time: "Just now", reversible: false });
          state.tab = "pipeline";
          save(); closeModal(); render();
          showToast(`Extracted "${biz}" (${fmtINR(val)}) + Task!`);
        });
      });

      function openInvoiceModal(prefillClient) {
        openModal("Create 18% GST Invoice", `
          <form id="invForm">
            <div class="field"><label>Client Name</label><input id="ivClient" required value="${prefillClient || ""}" placeholder="e.g., Mahalaxmi Supermart" /></div>
            <div class="field"><label>Line Item Description</label><input id="ivDesc" required placeholder="e.g., Custom AI CRM Setup" /></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div class="field"><label>Qty</label><input id="ivQty" type="number" required value="1" min="1" /></div>
              <div class="field"><label>Rate (₹ before GST)</label><input id="ivRate" type="number" required value="34999" /></div>
            </div>
            <div class="field"><label>Status</label><select id="ivStatus"><option>Pending</option><option>Paid</option><option>Overdue</option></select></div>
            <button class="btn btn-primary" type="submit" style="width:100%;">Generate GST Invoice</button>
          </form>
        `);
        document.getElementById("invForm").addEventListener("submit", (ev) => {
          ev.preventDefault();
          const num = Math.floor(510 + Math.random() * 400);
          const status = document.getElementById("ivStatus").value;
          state.invoices.unshift({
            id: `INV-${num}`,
            client: document.getElementById("ivClient").value.trim(),
            items: [{ desc: document.getElementById("ivDesc").value.trim(), qty: Number(document.getElementById("ivQty").value), rate: Number(document.getElementById("ivRate").value) }],
            status,
            days: status === "Overdue" ? 7 : 0
          });
          state.tab = "billing";
          save(); closeModal(); render(); showToast(`Invoice INV-${num} created!`);
        });
      }

      mainEl.addEventListener("submit", (e) => {
        if (e.target.id === "chatForm") {
          e.preventDefault();
          const input = document.getElementById("chatInput");
          const active = state.threads.find(t => t.id === state.activeThreadId);
          if (active && input && input.value.trim()) {
            active.messages.push({ from: "out", text: input.value.trim() });
            save(); render(); showToast("Message sent & logged!");
          }
        }
        if (e.target.id === "aiCmdForm") {
          e.preventDefault();
          const input = document.getElementById("aiCmdInput");
          if (input && input.value.trim()) runAICommand(input.value.trim());
        }
        if (e.target.id === "waCampaignForm") {
          e.preventDefault();
          const seg = document.getElementById("campSeg").value;
          const tpl = document.getElementById("campTpl").value;
          const count = seg === "overdue" ? state.invoices.filter(i=>i.status==="Overdue").length : seg === "quotesent" ? state.leads.filter(l=>l.stage==="Quote Sent").length : state.leads.length;
          state.aiQueue.unshift({
            id: "q" + Date.now(),
            title: `Send WhatsApp Campaign (${count} recipients)`,
            detail: `Template: "${tpl}" · Segment: ${seg}`,
            type: "followup"
          });
          state.tab = "ai";
          save(); render();
          showToast(`Campaign queued for ${count} contact(s) in AI Operator!`);
        }
      });

      function downloadCSV(filename, rows) {
        const csv = rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        showToast(`Exported ${filename}`);
      }

      async function runAICommand(cmd) {
        state.aiChat.push({ role: "user", text: cmd });
        const cfg = getCloudCfg();
        if (cfg.url && cfg.anonKey) {
          const ac = new AbortController();
          const timer = setTimeout(() => ac.abort(), 8000);
          try {
            state.aiChat.push({ role: "ai", text: "Thinking via Gemini AI Operator..." });
            render();
            const aiHeaders = {
              "Content-Type": "application/json",
              "apikey": cfg.anonKey
            };
            const userTok = getAuth()?.access_token;
            if (userTok) aiHeaders["Authorization"] = `Bearer ${userTok}`;
            const res = await fetch(`${cfg.url}/functions/v1/crm-ai`, {
              method: "POST",
              headers: aiHeaders,
              signal: ac.signal,
              body: JSON.stringify({
                command: cmd,
                context: {
                  industry: PRESETS[state.preset].label,
                  leads: state.leads.map(l => ({ name: l.name, stage: l.stage, value: l.value })),
                  invoices: state.invoices.map(i => ({ id: i.id, client: i.client, base: invBase(i), status: i.status, days: i.days }))
                }
              })
            });
            clearTimeout(timer);
            if (res.ok) {
              const data = await res.json();
              if (state.aiChat[state.aiChat.length - 1]?.text?.startsWith("Thinking")) state.aiChat.pop();
              state.aiChat.push({ role: "ai", text: `${data.reply}${data.model ? ` (${data.model})` : ""}` });
              if (data.proposedAction && data.proposedAction.title) {
                state.aiQueue.unshift({
                  id: "q" + Date.now(),
                  title: data.proposedAction.title,
                  detail: data.proposedAction.detail || cmd,
                  type: data.proposedAction.type || "followup"
                });
              }
              save(); render();
              return;
            }
            if (state.aiChat[state.aiChat.length - 1]?.text?.startsWith("Thinking")) state.aiChat.pop();
          } catch (_) {
            clearTimeout(timer);
            if (state.aiChat[state.aiChat.length - 1]?.text?.startsWith("Thinking")) state.aiChat.pop();
          }
        }

        const lower = cmd.toLowerCase();
        let reply = "";
        if (lower.includes("overdue") || lower.includes("invoice") || lower.includes("reminder")) {
          const overdue = state.invoices.filter(i => i.status === "Overdue");
          if (overdue.length) {
            overdue.forEach(inv => {
              if (!state.aiQueue.some(q => q.targetId === inv.id)) {
                state.aiQueue.unshift({
                  id: "q" + Date.now() + Math.random().toString(16).slice(2, 5),
                  title: `Send WhatsApp Payment Reminder (${inv.id})`,
                  detail: `${inv.client} — ${fmtINR(invBase(inv))} + GST overdue by ${inv.days} days.`,
                  type: "reminder",
                  targetId: inv.id
                });
              }
            });
            reply = `Found ${overdue.length} overdue invoice(s). Queued WhatsApp reminder(s) in Approval Queue below.`;
          } else {
            reply = "All invoices are clear — zero overdue dues!";
          }
        } else if (lower.includes("forecast") || lower.includes("hot") || lower.includes("pipeline")) {
          const qs = state.leads.filter(l => l.stage === "Quote Sent");
          const total = state.leads.reduce((s, l) => s + l.value, 0);
          reply = `Total pipeline is ${fmtINR(total)}. ${qs.length} hot deal(s) in Quote Sent (${qs.map(x => x.name).join(", ") || "none"}) — weighted close forecast: ${fmtINR(Math.round(total * 0.62))}.`;
        } else {
          const nl = state.leads.filter(l => l.stage === "New Lead");
          state.aiQueue.unshift({
            id: "q" + Date.now(),
            title: `Send Personalized WhatsApp Follow-Up (${nl.length || 1} Lead)`,
            detail: nl.length ? `Targets: ${nl.map(l => l.name).join(", ")}` : `Action for: "${cmd}"`,
            type: "followup"
          });
          reply = `Prepared a permission-checked follow-up action for "${cmd}" in your Approval Queue.`;
        }
        state.aiChat.push({ role: "ai", text: reply });
        save(); render();
      }

      // Drawer Events
      document.getElementById("drawerBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "drawerBackdrop" || e.target.id === "closeDrawerBtn") {
          state.selectedLeadId = null;
          renderDrawer();
        }
      });
      document.getElementById("drawerContent").addEventListener("change", (e) => {
        if (e.target.id === "drawerStageSelect") {
          const lead = state.leads.find(l => l.id === state.selectedLeadId);
          if (lead) {
            lead.stage = e.target.value;
            lead.timeline.unshift(`Stage updated to ${lead.stage}`);
            save(); render(); showToast(`Stage updated to ${lead.stage}`);
          }
        }
      });
      document.getElementById("drawerContent").addEventListener("click", (e) => {
        const lead = state.leads.find(l => l.id === state.selectedLeadId);
        if (!lead) return;
        if (e.target.id === "drawerQuoteBtn") { openInvoiceModal(lead.name); }
        if (e.target.id === "drawerWaBtn") {
          state.aiQueue.unshift({ id: "q" + Date.now(), title: `Send WhatsApp Follow-up to ${lead.name}`, detail: `Contact ${lead.contact} (${lead.phone}) regarding ${lead.note}`, type: "followup" });
          state.tab = "ai"; state.selectedLeadId = null;
          save(); render(); showToast("Queued in AI Operator!");
        }
      });
      document.getElementById("drawerContent").addEventListener("submit", (e) => {
        if (e.target.id === "drawerNoteForm") {
          e.preventDefault();
          const lead = state.leads.find(l => l.id === state.selectedLeadId);
          const inp = document.getElementById("drawerNoteInput");
          if (lead && inp && inp.value.trim()) {
            lead.timeline = lead.timeline || [];
            lead.timeline.unshift(inp.value.trim());
            save(); renderDrawer(); showToast("Note added to timeline");
          }
        }
      });

      render();

      // Cookie Consent System
      const COOKIE_KEY = "sc_cookie_consent";
      const cookieBanner = document.getElementById("cookieBanner");
      function readCookiePrefs() {
        try {
          const m = document.cookie.match(/(?:^|;\s*)sc_cookie_consent=([^;]+)/);
          if (m) return JSON.parse(decodeURIComponent(m[1]));
          const ls = localStorage.getItem(COOKIE_KEY);
          return ls ? JSON.parse(ls) : null;
        } catch (_) { return null; }
      }
      function saveCookiePrefs(prefs) {
        const val = { essential: true, preferences: !!prefs.preferences, diagnostics: !!prefs.diagnostics, ts: Date.now() };
        try {
          document.cookie = `sc_cookie_consent=${encodeURIComponent(JSON.stringify(val))}; max-age=15552000; path=/; SameSite=Lax`;
          localStorage.setItem(COOKIE_KEY, JSON.stringify(val));
        } catch (_) {}
        cookieBanner.style.display = "none";
      }
      function openCookieModal() {
        const cur = readCookiePrefs() || { preferences: true, diagnostics: true };
        openModal("Cookie & Storage Preferences", `
          <label style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;">
            <span><strong>Essential Cookies</strong><br><small style="color:var(--muted);">Auth session, Lead/Invoice demo state</small></span>
            <input type="checkbox" checked disabled />
          </label>
          <label style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;">
            <span><strong>Workspace Preferences</strong><br><small style="color:var(--muted);">Remembers industry preset &amp; Mobile View</small></span>
            <input type="checkbox" id="ckPref" ${cur.preferences ? "checked" : ""} />
          </label>
          <label style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;cursor:pointer;">
            <span><strong>Diagnostics &amp; Auto-Tests</strong><br><small style="color:var(--muted);">Enables live CRM self-test diagnostics</small></span>
            <input type="checkbox" id="ckDiag" ${cur.diagnostics ? "checked" : ""} />
          </label>
          <button type="button" id="ckSaveBtn" class="btn btn-primary" style="width:100%;">Save Cookie Preferences</button>
        `);
        document.getElementById("ckSaveBtn").addEventListener("click", () => {
          saveCookiePrefs({
            preferences: document.getElementById("ckPref").checked,
            diagnostics: document.getElementById("ckDiag").checked
          });
          closeModal();
          showToast("Cookie preferences saved!");
        });
      }
      if (!readCookiePrefs()) cookieBanner.style.display = "block";
      document.getElementById("cookieAcceptAllBtn").addEventListener("click", () => { saveCookiePrefs({ preferences: true, diagnostics: true }); showToast("All cookies accepted"); });
      document.getElementById("cookieEssentialBtn").addEventListener("click", () => { saveCookiePrefs({ preferences: false, diagnostics: false }); showToast("Essential cookies only"); });
      document.getElementById("cookieManageBtn").addEventListener("click", openCookieModal);
      document.getElementById("openCrmCookieBtn").addEventListener("click", openCookieModal);

      // Built-in CRM Bug Auto-Tester (Ctrl+Shift+T, ?autotest=1, or Sidebar Auto-Test)
      const runtimeErrors = [];
      window.addEventListener("error", (ev) => runtimeErrors.push(ev.message || "Script error"));
      window.addEventListener("unhandledrejection", (ev) => runtimeErrors.push(String(ev.reason || "Promise rejection")));

      function runCrmAutoTest(showUI = true) {
        const checks = [];
        const add = (name, ok, detail) => checks.push({ name, ok: !!ok, detail: detail || "" });
        const origTab = state.tab;

        add("0 Runtime JS Errors", runtimeErrors.length === 0, runtimeErrors.length ? runtimeErrors.join("; ") : "Clean");
        add("6 Industry Presets Loaded", Object.keys(PRESETS).length === 6, Object.keys(PRESETS).join(", "));

        const navTabs = Array.from(document.querySelectorAll("#navGroup [data-tab]"));
        let allTabsOk = navTabs.length === 8;
        navTabs.forEach(btn => {
          state.tab = btn.dataset.tab;
          render();
          if (!mainEl.innerHTML.trim()) allTabsOk = false;
        });
        state.tab = origTab;
        render();
        add("All 8 CRM Modules Render", allTabsOk, `${navTabs.length} modules verified`);

        const firstLead = state.leads[0];
        let drawerOk = false;
        if (firstLead) {
          state.selectedLeadId = firstLead.id;
          renderDrawer();
          drawerOk = document.getElementById("drawerBackdrop").classList.contains("open");
          state.selectedLeadId = null;
          renderDrawer();
        }
        add("Lead 360° Slide-Over Drawer", drawerOk, firstLead ? firstLead.name : "N/A");

        const inv0 = state.invoices[0];
        const gstOk = inv0 ? Math.round(invBase(inv0) * 0.18) >= 0 : false;
        add("18% CGST/SGST Billing Engine", gstOk, inv0 ? `${inv0.id} verified` : "No invoice");

        const prevMob = state.mobilePreview;
        state.mobilePreview = !prevMob;
        updateShell();
        const mobOk = workspaceWrap.classList.contains("mobile-frame") === !prevMob;
        state.mobilePreview = prevMob;
        updateShell();
        add("Field Mobile View Toggle", mobOk, "Desktop <-> Mobile responsive");

        add("Cookie Consent System", !!document.getElementById("cookieBanner") && typeof saveCookiePrefs === "function", readCookiePrefs() ? "Consent saved" : "Banner ready");
        add("Supabase JS SDK v2 Ready", !!(window.supabase && window.supabase.createClient), getCloudCfg().url || "Not set");
        add("Voice-to-CRM & Client Portal Ready", !!(document.getElementById("voiceNoteBtn") && typeof openClientPortal === "function"), "Voice + UPI Portal live");

        const passed = checks.filter(c => c.ok).length;
        if (showUI) {
          openModal(`CRM Bug Auto-Tester (${passed}/${checks.length} Passed)`, `
            <div style="display:flex;flex-direction:column;gap:7px;">
              ${checks.map(c => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-radius:10px;background:${c.ok ? "#ecfdf5" : "#fef2f2"};color:${c.ok ? "#065f46" : "#991b1b"};font-size:12.5px;">
                  <span><strong>${c.ok ? "PASS" : "FAIL"}:</strong> ${c.name}</span>
                  <small>${c.detail}</small>
                </div>
              `).join("")}
            </div>
          `);
        }
        return { passed, total: checks.length, checks };
      }

      window.__scCrmTest = { runCrmAutoTest, readCookiePrefs };
      document.getElementById("runCrmTestBtn").addEventListener("click", () => runCrmAutoTest(true));
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "t") { e.preventDefault(); runCrmAutoTest(true); }
      });
      if (new URLSearchParams(window.location.search).get("autotest") === "1") {
        setTimeout(() => runCrmAutoTest(true), 250);
      }
    })();
  </script>
</body>
</html>
